name: GrowStream News Bot

on:
  schedule:
    - cron: '0 2 * * *'   # Daily 2am UTC = 7:30am IST
  workflow_dispatch:

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic feedparser requests httpx[http2] python-dotenv json-repair

      - name: Test Anthropic API connectivity
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          python - <<'PYEOF'
          import anthropic, os
          print("Testing Anthropic API connection...")
          client = anthropic.Anthropic(api_key=os.environ["CLAUDE_API_KEY"])
          r = client.messages.create(
              model="claude-haiku-4-5-20251001",
              max_tokens=20,
              messages=[{"role": "user", "content": "Say OK"}]
          )
          print("SUCCESS:", r.content[0].text)
          PYEOF

      - name: Run news bot
        id: run_bot
        env:
          CLAUDE_API_KEY:   ${{ secrets.CLAUDE_API_KEY }}
          WP_USERNAME:      ${{ secrets.WP_USERNAME }}
          WP_PASSWORD:      ${{ secrets.WP_PASSWORD }}
          WP_API_KEY:       ${{ secrets.WP_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
        run: python run.py --site growstreammedia --pipeline daily_news

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: "*.log"
          retention-days: 7
