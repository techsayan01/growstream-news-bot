name: GrowStream News Bot

on:
  schedule:
    # All times UTC (IST = UTC+5:30)
    # ── Daily News: 3 runs × 5 articles = 15 articles/day ───────────────────
    - cron: '0 3 * * *'      # 08:30 IST — daily_news morning
    - cron: '0 7 * * *'      # 12:30 IST — daily_news midday
    - cron: '30 11 * * *'    # 17:00 IST — daily_news evening
    # ── Hot Takes: 2 per day ─────────────────────────────────────────────────
    - cron: '30 5 * * *'     # 11:00 IST — hot_takes morning
    - cron: '0 13 * * *'     # 18:30 IST — hot_takes evening
    # ── Specialist pipelines ─────────────────────────────────────────────────
    - cron: '30 4 * * 1,3,5' # 10:00 IST Mon/Wed/Fri — follow_the_money
    - cron: '30 4 * * 2,4'   # 10:00 IST Tue/Thu     — translated
    - cron: '30 3 * * 0'     # 09:00 IST Sunday      — dumbest_move
    - cron: '0 4 1 * *'      # 09:30 IST 1st of month — leaderboards
    # ── Evergreen: daily Mon–Fri ─────────────────────────────────────────────
    - cron: '30 1 * * 1,2,3,4,5'  # 07:00 IST Mon-Fri — evergreen

  # Manual trigger
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline to run'
        required: true
        default: 'daily_news'
        type: choice
        options:
          - daily_news
          - hot_takes
          - follow_the_money
          - translated
          - dumbest_move
          - leaderboards
          - evergreen
          - social

concurrency:
  # Each schedule slot gets its own group so they never block each other.
  # workflow_dispatch runs share one group (prevents accidental double-trigger).
  group: newsbot-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine pipeline
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pipeline=${{ inputs.pipeline }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 3 * * *")           echo "pipeline=daily_news"        >> $GITHUB_OUTPUT ;;
              "0 7 * * *")           echo "pipeline=daily_news"        >> $GITHUB_OUTPUT ;;
              "30 11 * * *")         echo "pipeline=daily_news"        >> $GITHUB_OUTPUT ;;
              "30 5 * * *")          echo "pipeline=hot_takes"         >> $GITHUB_OUTPUT ;;
              "0 13 * * *")          echo "pipeline=hot_takes"         >> $GITHUB_OUTPUT ;;
              "30 4 * * 1,3,5")      echo "pipeline=follow_the_money"  >> $GITHUB_OUTPUT ;;
              "30 4 * * 2,4")        echo "pipeline=translated"        >> $GITHUB_OUTPUT ;;
              "30 3 * * 0")          echo "pipeline=dumbest_move"      >> $GITHUB_OUTPUT ;;
              "0 4 1 * *")           echo "pipeline=leaderboards"      >> $GITHUB_OUTPUT ;;
              "30 1 * * 1,2,3,4,5")  echo "pipeline=evergreen"         >> $GITHUB_OUTPUT ;;
              *)                     echo "pipeline=daily_news"        >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Run ${{ steps.pick.outputs.pipeline }}
        run: python run.py --pipeline ${{ steps.pick.outputs.pipeline }}
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          NEWSBOT_WRITER:        ${{ secrets.NEWSBOT_WRITER }}
          MONGODB_URI:           ${{ secrets.MONGODB_URI }}
          MONGODB_DB_PASSWORD:   ${{ secrets.MONGODB_DB_PASSWORD }}
          WP_URL:                ${{ secrets.WP_URL }}
          WP_USERNAME:           ${{ secrets.WP_USERNAME }}
          WP_PASSWORD:           ${{ secrets.WP_PASSWORD }}
          WP_API_KEY:            ${{ secrets.WP_API_KEY }}
          UNSPLASH_API_KEY:      ${{ secrets.UNSPLASH_API_KEY }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: newsbot-logs-${{ github.run_id }}
          path: '*.log'
          retention-days: 7
