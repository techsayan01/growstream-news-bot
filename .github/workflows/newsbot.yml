name: GrowStream News Bot

on:
  # ── Scheduled runs (UTC). Reduced-volume cadence — high-volume AI content on
  #    YMYL finance topics gets throttled by Google's Helpful Content system, so
  #    fewer, tighter articles index better. Mirrors scheduler.py. ────────────
  schedule:
    - cron: "30 1 * * 1,2,3,4,5"   # evergreen        — Mon–Fri 07:00 IST (pillar content)
    - cron: "30 3 * * *"           # daily_news india — 09:00 IST
    - cron: "0 13 * * *"           # daily_news us-east — 18:30 IST
    - cron: "0 15 * * *"           # hot_takes         — 20:30 IST
    - cron: "0 9 * * 3"            # follow_the_money  — Wed 14:30 IST
    - cron: "30 9 * * 4"           # translated        — Thu 15:00 IST
    - cron: "0 17 * * 0"           # dumbest_move      — Sun
    - cron: "0 4 1 * *"            # leaderboards      — 1st of month

  # Manual trigger
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline to run'
        required: true
        default: 'daily_news'
        type: choice
        options:
          - daily_news
          - hot_takes
          - follow_the_money
          - translated
          - dumbest_move
          - leaderboards
          - evergreen
          - social

concurrency:
  group: newsbot-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine pipeline and region
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pipeline=${{ inputs.pipeline }}" >> $GITHUB_OUTPUT
            echo "region="                          >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "30 1 * * 1,2,3,4,5")  echo "pipeline=evergreen"         >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              "30 3 * * *")           echo "pipeline=daily_news"        >> $GITHUB_OUTPUT; echo "region=india"     >> $GITHUB_OUTPUT ;;
              "0 13 * * *")           echo "pipeline=daily_news"        >> $GITHUB_OUTPUT; echo "region=us-east"   >> $GITHUB_OUTPUT ;;
              "0 15 * * *")           echo "pipeline=hot_takes"         >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              "0 9 * * 3")            echo "pipeline=follow_the_money"  >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              "30 9 * * 4")           echo "pipeline=translated"        >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              "0 17 * * 0")           echo "pipeline=dumbest_move"      >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              "0 4 1 * *")            echo "pipeline=leaderboards"      >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              *)                      echo "pipeline=daily_news"        >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Run ${{ steps.pick.outputs.pipeline }}
        run: |
          REGION="${{ steps.pick.outputs.region }}"
          if [ -n "$REGION" ]; then
            python run.py --pipeline ${{ steps.pick.outputs.pipeline }} --region "$REGION"
          else
            python run.py --pipeline ${{ steps.pick.outputs.pipeline }}
          fi
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          NEWSBOT_WRITER:        ${{ secrets.NEWSBOT_WRITER }}
          MONGODB_URI:           ${{ secrets.MONGODB_URI }}
          MONGODB_DB_PASSWORD:   ${{ secrets.MONGODB_DB_PASSWORD }}
          WP_URL:                ${{ secrets.WP_URL }}
          WP_USERNAME:           ${{ secrets.WP_USERNAME }}
          WP_PASSWORD:           ${{ secrets.WP_PASSWORD }}
          WP_API_KEY:            ${{ secrets.WP_API_KEY }}
          UNSPLASH_API_KEY:          ${{ secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY:            ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:           ${{ secrets.PIXABAY_API_KEY }}
          LINKEDIN_ACCESS_TOKEN:     ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN:    ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID:        ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET:    ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ORG_URN:          ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_PERSON_URN:       ${{ secrets.LINKEDIN_PERSON_URN }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: newsbot-logs-${{ github.run_id }}
          path: '*.log'
          retention-days: 7
