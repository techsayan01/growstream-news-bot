name: GrowStream News Bot

on:
  schedule:
    # All times UTC (IST = UTC+5:30, GMT = UTC+0, EST = UTC-5, PST = UTC-8)
    #
    # Schedule designed to hit 4 global finance audiences:
    #   India morning   → 09:00 IST  (03:30 UTC)
    #   London open     → 13:30 IST  (08:00 UTC)
    #   US East morning → 18:30 IST  (13:00 UTC)
    #   US midday       → 20:30 IST  (15:00 UTC)
    #
    # ── Evergreen — Mon–Fri, early IST (SEO indexing before peak traffic) ────
    - cron: '30 1 * * 1,2,3,4,5'    # 07:00 IST

    # ── Daily News — 3 runs hitting India / London / US East ────────────────
    - cron: '30 3 * * *'             # 09:00 IST  (03:30 UTC)
    - cron: '0 8 * * *'              # 13:30 IST  (08:00 UTC) — London open
    - cron: '0 13 * * *'             # 18:30 IST  (13:00 UTC) — US East morning

    # ── Hot Takes — India midday + US midday ────────────────────────────────
    - cron: '30 5 * * *'             # 11:00 IST  (05:30 UTC)
    - cron: '0 15 * * *'             # 20:30 IST  (15:00 UTC) — 10:00 EST / 07:00 PST

    # ── Follow the Money — Mon / Wed / Fri, London open ─────────────────────
    - cron: '0 9 * * 1,3,5'          # 14:30 IST  (09:00 UTC) — 09:00 GMT

    # ── Translated — Tue / Thu, London open ─────────────────────────────────
    - cron: '30 9 * * 2,4'           # 15:00 IST  (09:30 UTC) — 09:30 GMT

    # ── Dumbest Move — Sunday US midday ─────────────────────────────────────
    - cron: '0 17 * * 0'             # 22:30 IST  (17:00 UTC) — 12:00 EST / 09:00 PST

    # ── Leaderboards — 1st of month, India morning ──────────────────────────
    - cron: '0 4 1 * *'              # 09:30 IST  (04:00 UTC)

  # Manual trigger
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline to run'
        required: true
        default: 'daily_news'
        type: choice
        options:
          - daily_news
          - hot_takes
          - follow_the_money
          - translated
          - dumbest_move
          - leaderboards
          - evergreen
          - social

concurrency:
  group: newsbot-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine pipeline and region
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pipeline=${{ inputs.pipeline }}" >> $GITHUB_OUTPUT
            echo "region="                          >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "30 1 * * 1,2,3,4,5")  echo "pipeline=evergreen"         >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              "30 3 * * *")           echo "pipeline=daily_news"        >> $GITHUB_OUTPUT; echo "region=india"     >> $GITHUB_OUTPUT ;;
              "0 8 * * *")            echo "pipeline=daily_news"        >> $GITHUB_OUTPUT; echo "region=london"    >> $GITHUB_OUTPUT ;;
              "0 13 * * *")           echo "pipeline=daily_news"        >> $GITHUB_OUTPUT; echo "region=us-east"   >> $GITHUB_OUTPUT ;;
              "30 5 * * *")           echo "pipeline=hot_takes"         >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              "0 15 * * *")           echo "pipeline=hot_takes"         >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              "0 9 * * 1,3,5")        echo "pipeline=follow_the_money"  >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              "30 9 * * 2,4")         echo "pipeline=translated"        >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              "0 17 * * 0")           echo "pipeline=dumbest_move"      >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              "0 4 1 * *")            echo "pipeline=leaderboards"      >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
              *)                      echo "pipeline=daily_news"        >> $GITHUB_OUTPUT; echo "region="          >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Run ${{ steps.pick.outputs.pipeline }}
        run: |
          REGION="${{ steps.pick.outputs.region }}"
          if [ -n "$REGION" ]; then
            python run.py --pipeline ${{ steps.pick.outputs.pipeline }} --region "$REGION"
          else
            python run.py --pipeline ${{ steps.pick.outputs.pipeline }}
          fi
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          NEWSBOT_WRITER:        ${{ secrets.NEWSBOT_WRITER }}
          MONGODB_URI:           ${{ secrets.MONGODB_URI }}
          MONGODB_DB_PASSWORD:   ${{ secrets.MONGODB_DB_PASSWORD }}
          WP_URL:                ${{ secrets.WP_URL }}
          WP_USERNAME:           ${{ secrets.WP_USERNAME }}
          WP_PASSWORD:           ${{ secrets.WP_PASSWORD }}
          WP_API_KEY:            ${{ secrets.WP_API_KEY }}
          UNSPLASH_API_KEY:      ${{ secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:       ${{ secrets.PIXABAY_API_KEY }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: newsbot-logs-${{ github.run_id }}
          path: '*.log'
          retention-days: 7
